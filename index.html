<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a6b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Planning GammVert Cazères">
<title>GammVert · Planning</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --g900:#0d3b18; --g800:#1a6b2a; --g700:#22873a; --g600:#2ea349;
  --g400:#5cc875; --g100:#e8f7ec; --g50:#f2fbf4;
  --s100:#f1f5f9; --s200:#e2e8f0; --s400:#94a3b8;
  --s500:#64748b; --s700:#334155; --s900:#0f172a;
  --white:#fff;
  --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --r:14px; --r-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--s100);color:var(--s900);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.screen{display:none;min-height:100dvh}
.screen.active{display:flex;flex-direction:column}

/* ── LOGIN ── */
#loginScreen{background:var(--g900);overflow:hidden;position:relative}
#loginScreen::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(46,163,73,.25) 0%,transparent 70%);border-radius:50%}
#loginScreen::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(92,200,117,.12) 0%,transparent 70%);border-radius:50%}
.login-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:52px 20px 40px;flex:1}
.login-logo{width:68px;height:68px;background:linear-gradient(135deg,var(--g400),var(--g600));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.3);margin-bottom:18px;animation:logoIn .5s ease-out}
@keyframes logoIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:none}}
.login-title{font-size:24px;font-weight:700;color:var(--white);letter-spacing:-.4px;animation:fadeUp .5s .1s ease-out both}
.login-sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:5px;margin-bottom:32px;animation:fadeUp .5s .15s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.login-card{width:100%;max-width:400px;background:var(--white);border-radius:18px;padding:22px;box-shadow:var(--shadow-lg);animation:cardIn .5s .2s ease-out both}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card-label{font-size:11px;font-weight:600;color:var(--s500);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.emp-grid{display:flex;flex-direction:column;gap:7px}
.emp-btn{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--s200);border-radius:var(--r);background:var(--white);transition:border-color .15s,background .15s,transform .1s;text-align:left;width:100%}
.emp-btn:active{transform:scale(.98)}
.emp-btn:hover{border-color:var(--g600);background:var(--g50)}
.emp-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--white);flex-shrink:0;letter-spacing:-.4px}
.emp-name{font-size:14px;font-weight:600;color:var(--s900)}
.emp-arrow{margin-left:auto;color:var(--s400);font-size:17px}

/* ── HEADER ── */
.app-header{background:var(--g800);color:var(--white);padding:11px 15px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hdr-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--white);flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
.hdr-actions{display:flex;align-items:center;gap:7px}
.notif-dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;display:none;box-shadow:0 0 0 2px var(--g800);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);font-size:17px;color:var(--white);transition:background .15s}
.icon-btn:active{background:rgba(255,255,255,.3)}

/* ── UPDATE BANNER ── */
.update-banner{background:#f59e0b;color:var(--s900);text-align:center;padding:9px 15px;font-size:13px;font-weight:600;display:none;gap:7px;align-items:center;justify-content:center;cursor:pointer;animation:slideDown .3s ease-out}
.update-banner.visible{display:flex}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}

/* ── MONTH NAV ── */
.month-nav{background:var(--white);border-bottom:1px solid var(--s200);padding:13px 15px;display:flex;align-items:center;justify-content:space-between}
.nav-btn{width:34px;height:34px;border-radius:50%;background:var(--g100);color:var(--g800);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .15s}
.nav-btn:active{background:var(--g600);color:var(--white)}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.month-label{text-align:center}
.month-name{font-size:17px;font-weight:700;color:var(--s900);text-transform:capitalize;letter-spacing:-.3px}
.month-year{font-size:11px;color:var(--s400);margin-top:1px}

/* ── STATS ── */
.stats-strip{background:var(--g800);padding:9px 15px;display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stats-strip::-webkit-scrollbar{display:none}
.stat-chip{background:rgba(255,255,255,.15);color:var(--white);border-radius:18px;padding:5px 13px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}

/* ── PLANNING LIST ── */
.planning-scroll{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.day-row{background:var(--white);border-radius:var(--r);display:flex;align-items:stretch;box-shadow:var(--shadow);overflow:hidden}
.day-row.is-today{box-shadow:0 0 0 2px var(--g600),var(--shadow)}
.day-row.is-past{opacity:.6}
.day-row.is-weekend .day-side{background:var(--s200)}
.day-side{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:11px 5px;background:var(--s100)}
.day-row.is-today .day-side{background:var(--g800)}
.d-name{font-size:9px;font-weight:600;text-transform:uppercase;color:var(--s400);letter-spacing:.5px}
.d-num{font-size:21px;font-weight:700;color:var(--s700);line-height:1.1;font-variant-numeric:tabular-nums}
.day-row.is-today .d-name{color:rgba(255,255,255,.65)}
.day-row.is-today .d-num{color:var(--white)}
.day-main{flex:1;padding:9px 13px;display:flex;align-items:center;gap:9px;min-width:0}
.shift-pill{padding:5px 11px;border-radius:18px;font-size:11px;font-weight:700;flex-shrink:0;letter-spacing:.2px}
.shift-hours{font-size:12px;color:var(--s500);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.today-tag{margin-left:auto;background:var(--g100);color:var(--g700);font-size:9px;font-weight:700;padding:3px 7px;border-radius:9px;flex-shrink:0;text-transform:uppercase;letter-spacing:.5px}

/* Shift colors */
.s-REPOS{background:#f1f5f9;color:#64748b}
.s-CONGES{background:#fce7f3;color:#9d174d}
.s-AT{background:#fffbeb;color:#92400e}
.s-REL{background:#dcfce7;color:#15803d}
.s-RECUP{background:#e0f2fe;color:#0369a1}
.s-CFA{background:#ede9fe;color:#6d28d9}
.s-JOURNEE{background:#dbeafe;color:#1d4ed8}
.s-FORMATION{background:#fef9c3;color:#854d0e}
.s-REUNION{background:#fef9c3;color:#854d0e}
.s-HORAIRE{background:#dcfce7;color:#15803d}
.s-default{background:#f1f5f9;color:#64748b}

/* ── STATES ── */
.center-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;gap:14px}
.spinner{width:38px;height:38px;border:3px solid var(--s200);border-top-color:var(--g600);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-icon{font-size:46px}
.state-title{font-size:16px;font-weight:700;color:var(--s700)}
.state-desc{font-size:13px;color:var(--s400);line-height:1.5}
.retry-btn{background:var(--g600);color:var(--white);padding:9px 22px;border-radius:22px;font-size:13px;font-weight:600}

/* ── FOOTER ── */
.app-footer{background:var(--white);border-top:1px solid var(--s200);padding:7px 15px;font-size:10px;color:var(--s400);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}

/* ── INSTALL BAR ── */
.install-bar{background:var(--g100);border:1px solid var(--g400);border-radius:var(--r);margin:10px;padding:11px 13px;display:none;flex-direction:column;gap:7px}
.install-bar.visible{display:flex}
.ib-top{display:flex;align-items:center;gap:9px}
.ib-icon{font-size:22px}
.ib-text{flex:1}
.ib-title{font-size:12px;font-weight:700;color:var(--g900)}
.ib-sub{font-size:11px;color:var(--g700)}
.ib-actions{display:flex;gap:7px;justify-content:flex-end}
.ib-btn{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:600}
.ib-yes{background:var(--g700);color:var(--white)}
.ib-no{color:var(--s500)}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--s900);color:var(--white);padding:11px 18px;border-radius:22px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;max-width:290px;text-align:center;white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-inner">
    <div class="login-logo">🌿</div>
    <div class="login-title">GammVert Cazères</div>
    <div class="login-sub">Votre planning en un clic</div>
    <div class="login-card">
      <div class="card-label">Sélectionnez votre nom</div>
      <div class="emp-grid" id="empGrid"></div>
    </div>
  </div>
</div>

<!-- PLANNING -->
<div id="planningScreen" class="screen">

  <div class="app-header">
    <div class="hdr-avatar" id="hdrAvatar"></div>
    <div class="hdr-info">
      <div class="hdr-name" id="hdrName"></div>
      <div class="hdr-sub">GammVert Cazères · Lecture seule</div>
    </div>
    <div class="hdr-actions">
      <div class="notif-dot" id="notifDot"></div>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="update-banner" id="updateBanner" onclick="doRefresh()">
    🔄 <span>Planning mis à jour — Appuyez pour recharger</span>
  </div>

  <div class="month-nav">
    <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
    <div class="month-label">
      <div class="month-name" id="monthName"></div>
      <div class="month-year" id="monthYear"></div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="stats-strip" id="statsStrip"></div>

  <div class="install-bar" id="installBar">
    <div class="ib-top">
      <div class="ib-icon">📲</div>
      <div class="ib-text">
        <div class="ib-title">Installer l'application</div>
        <div class="ib-sub">Accès rapide depuis l'écran d'accueil</div>
      </div>
    </div>
    <div class="ib-actions">
      <button class="ib-btn ib-no" onclick="dismissInstall()">Plus tard</button>
      <button class="ib-btn ib-yes" onclick="doInstall()">Installer</button>
    </div>
  </div>

  <div class="planning-scroll" id="planningList">
    <div class="center-state"><div class="spinner"></div></div>
  </div>

  <div class="app-footer">
    <span id="footerUpdate">—</span>
    <span id="footerStatus">⏳ Synchronisation…</span>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ================================================================
// CONFIG — URL à remplir après déploiement Apps Script
// ================================================================
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby_gnCtcZl0ELC5yMpAZ9yjdhCgK8i6_iSMxsobbdhBqG51E-baAuovyt57JQCwZ_31eA/exec',

  EMPLOYEES: [
    { name: 'Xavier',  color: '#1a6b2a' },
    { name: 'Kévin',   color: '#1d4ed8' },
    { name: 'Emilie',  color: '#9d174d' },
    { name: 'Mailis',  color: '#6d28d9' },
    { name: 'Armelle', color: '#c2410c' },
    { name: 'Oceane',  color: '#0e7490' },
    { name: 'Kenzo',   color: '#854d0e' },
  ],

  SHIFTS: {
    'REPOS':     { label: 'Repos',     emoji: '😴' },
    'CONGES':    { label: 'Congés',    emoji: '🏖️' },
    'AT':        { label: 'Astreinte', emoji: '🔔' },
    'REL':       { label: 'REL',       emoji: '🔄' },
    'RECUP':     { label: 'Récup.',    emoji: '💤' },
    'CFA':       { label: 'CFA',       emoji: '🎓' },
    'JOURNEE':   { label: 'Journée',   emoji: '☀️' },
    'FORMATION': { label: 'Formation', emoji: '📚' },
    'REUNION':   { label: 'Réunion',   emoji: '💬' },
    'HORAIRE':   { label: '',          emoji: '🕐' },
  },

  MIN_MONTH:     '2026-05',
  MAX_MONTH:     '2027-05',
  POLL_INTERVAL: 5 * 60 * 1000,
};

// ================================================================
// STATE
// ================================================================
const state = {
  employee: null, currentDate: new Date(),
  cache: {}, lastUpdate: {}, pollTimer: null, deferredInstall: null,
};

// ================================================================
// INIT
// ================================================================
window.addEventListener('load', () => {
  registerSW();
  buildEmpList();
  setupInstall();
  const saved = localStorage.getItem('gv_emp');
  if (saved) {
    const emp = CONFIG.EMPLOYEES.find(e => e.name === saved);
    if (emp) loginAs(emp, false);
  }
});

// ================================================================
// EMPLOYEE LIST
// ================================================================
function buildEmpList() {
  document.getElementById('empGrid').innerHTML = CONFIG.EMPLOYEES.map(emp => `
    <button class="emp-btn" onclick='loginAs(${JSON.stringify(emp)})'>
      <div class="emp-avatar" style="background:${emp.color}">${initials(emp.name)}</div>
      <span class="emp-name">${emp.name}</span>
      <span class="emp-arrow">›</span>
    </button>`).join('');
}

// ================================================================
// LOGIN
// ================================================================
function loginAs(emp, animate = true) {
  state.employee = emp;
  localStorage.setItem('gv_emp', emp.name);
  const av = document.getElementById('hdrAvatar');
  av.textContent = initials(emp.name);
  av.style.background = emp.color;
  document.getElementById('hdrName').textContent = emp.name;
  showScreen('planningScreen');
  if (animate) showToast('Bonjour ' + emp.name.split(' ')[0] + ' 👋');
  renderMonthNav();
  loadMonth();
  startPolling();
  askNotif();
}

function openSettings() {
  if (confirm('Connecté en tant que : ' + state.employee.name + '\n\nOK pour changer de profil ?')) logout();
}

function logout() {
  stopPolling();
  state.employee = null;
  localStorage.removeItem('gv_emp');
  showScreen('loginScreen');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ================================================================
// MONTH NAV
// ================================================================
function changeMonth(d) {
  const c = state.currentDate;
  state.currentDate = new Date(c.getFullYear(), c.getMonth() + d, 1);
  renderMonthNav();
  loadMonth();
}

function renderMonthNav() {
  const d   = state.currentDate;
  const key = monthKey(d);
  const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin',
                  'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('monthName').textContent = MONTHS[d.getMonth()];
  document.getElementById('monthYear').textContent = d.getFullYear();
  document.getElementById('prevBtn').disabled = key <= CONFIG.MIN_MONTH;
  document.getElementById('nextBtn').disabled = key >= CONFIG.MAX_MONTH;
}

// ================================================================
// DATA
// ================================================================
async function loadMonth(silent = false) {
  const mk = monthKey(state.currentDate);
  if (!silent) showLoading();
  try {
    const url  = CONFIG.API_URL + '?employee=' + encodeURIComponent(state.employee.name) + '&month=' + mk;
    const res  = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (state.lastUpdate[mk] && data.lastUpdate !== state.lastUpdate[mk]) onChange(mk, data.lastUpdate);
    state.lastUpdate[mk] = data.lastUpdate;
    state.cache[mk] = data;
    lsSet('plan_' + mk, data);
    renderPlanning(data);
    setFooter(data.lastUpdate, false);
    hideBanner();
  } catch (err) {
    const cached = state.cache[mk] || lsGet('plan_' + mk);
    if (cached) {
      if (!silent) { renderPlanning(cached); setFooter(cached.lastUpdate, true); showToast('📴 Cache local (hors ligne)'); }
    } else if (!silent) {
      showError(err.message);
    }
  }
}

async function pollUpdate() {
  if (!state.employee) return;
  const mk = monthKey(state.currentDate);
  try {
    const url  = CONFIG.API_URL + '?employee=' + encodeURIComponent(state.employee.name) + '&month=' + mk + '&check=1';
    const data = await (await fetch(url, { cache: 'no-store' })).json();
    if (state.lastUpdate[mk] && data.lastUpdate && data.lastUpdate !== state.lastUpdate[mk]) onChange(mk, data.lastUpdate);
  } catch (_) {}
}

function onChange(mk, ts) {
  state.lastUpdate[mk] = ts;
  showBanner();
  sendNotif('Planning mis à jour 🌿', 'Votre planning ' + mkLabel(mk) + ' a changé.');
  showToast('🔔 Planning modifié !');
  document.getElementById('notifDot').style.display = 'block';
}

function doRefresh() {
  document.getElementById('notifDot').style.display = 'none';
  loadMonth();
}

function startPolling() { stopPolling(); state.pollTimer = setInterval(pollUpdate, CONFIG.POLL_INTERVAL); }
function stopPolling()  { if (state.pollTimer) clearInterval(state.pollTimer); }

// ================================================================
// RENDER
// ================================================================
function renderPlanning(data) {
  const list  = document.getElementById('planningList');
  const d     = state.currentDate;
  const year  = d.getFullYear(), month = d.getMonth();
  const today = new Date();
  const days  = new Date(year, month + 1, 0).getDate();
  const DNAMES = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

  let html = '', workDays = 0, totalH = 0;

  for (let day = 1; day <= days; day++) {
    const date    = new Date(year, month, day);
    const dk      = year + '-' + pad(month + 1) + '-' + pad(day);
    const isToday = date.toDateString() === today.toDateString();
    const isPast  = date < today && !isToday;
    const isWE    = date.getDay() === 0 || date.getDay() === 6;
    const dayData = data.days?.[dk] || {};
    const shift   = dayData.shift || '';
    const hours   = dayData.hours || '';
    const sInfo   = CONFIG.SHIFTS[shift] || {};
    const label   = shift === 'HORAIRE' ? '' : (sInfo.label || shift || '—');
    const emoji   = sInfo.emoji || '';
    const cls     = 's-' + (CONFIG.SHIFTS[shift] ? shift : 'default');

    if (shift && !['REPOS','CONGES'].includes(shift)) {
      workDays++;
      totalH += calcH(hours, shift);
    }

    const display = shift === 'HORAIRE' ? hours : (emoji + (label ? ' ' + label : ''));

    html += `<div class="${['day-row', isToday?'is-today':'', isPast?'is-past':'', isWE?'is-weekend':''].filter(Boolean).join(' ')}">
      <div class="day-side">
        <div class="d-name">${DNAMES[date.getDay()]}</div>
        <div class="d-num">${day}</div>
      </div>
      <div class="day-main">
        <span class="shift-pill ${cls}">${display || '—'}</span>
        ${shift === 'HORAIRE' ? '' : (hours ? `<span class="shift-hours">${hours}</span>` : '')}
        ${isToday ? '<span class="today-tag">Auj.</span>' : ''}
      </div>
    </div>`;
  }

  list.innerHTML = html;
  const todayEl = list.querySelector('.is-today');
  if (todayEl) setTimeout(() => todayEl.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80);

  document.getElementById('statsStrip').innerHTML =
    `<div class="stat-chip">📅 ${workDays} j. travaillés</div>` +
    `<div class="stat-chip">⏱ ${totalH}h prévues</div>` +
    `<div class="stat-chip">🗓 ${days} jours</div>`;
}

function showLoading() {
  document.getElementById('planningList').innerHTML =
    '<div class="center-state"><div class="spinner"></div><div class="state-title">Chargement…</div></div>';
}

function showError(msg) {
  document.getElementById('planningList').innerHTML =
    `<div class="center-state"><div class="state-icon">⚠️</div><div class="state-title">Impossible de charger</div>
     <div class="state-desc">${msg}<br><br>Vérifiez votre connexion.</div>
     <button class="retry-btn" onclick="loadMonth()">Réessayer</button></div>`;
}

function showBanner() { document.getElementById('updateBanner').classList.add('visible'); }
function hideBanner() { document.getElementById('updateBanner').classList.remove('visible'); }

function setFooter(ts, fromCache) {
  const d  = ts ? new Date(ts) : null;
  const dt = d ? d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}) : '—';
  document.getElementById('footerUpdate').textContent = 'Mis à jour : ' + dt;
  document.getElementById('footerStatus').textContent = fromCache ? '📴 Hors ligne' : '✅ Synchronisé';
}

// ================================================================
// NOTIFICATIONS
// ================================================================
async function askNotif() {
  if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
}
function sendNotif(title, body) {
  if ('Notification' in window && Notification.permission === 'granted')
    new Notification(title, { body, icon: 'icon.png' });
}

// ================================================================
// TOAST
// ================================================================
let _tt = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 3000);
}

// ================================================================
// INSTALL
// ================================================================
function setupInstall() {
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); state.deferredInstall = e;
    if (!localStorage.getItem('gv_nodl')) document.getElementById('installBar').classList.add('visible');
  });
}
function doInstall() {
  if (!state.deferredInstall) return;
  state.deferredInstall.prompt();
  state.deferredInstall.userChoice.then(r => {
    if (r.outcome === 'accepted') { showToast('✅ Application installée !'); document.getElementById('installBar').classList.remove('visible'); }
    state.deferredInstall = null;
  });
}
function dismissInstall() {
  localStorage.setItem('gv_nodl', '1');
  document.getElementById('installBar').classList.remove('visible');
}

// ================================================================
// SERVICE WORKER
// ================================================================
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const sw = `const C='gv-v1';const A=['/'];self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(A)));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});self.addEventListener('fetch',e=>{if(e.request.url.includes('script.google.com')){e.respondWith(fetch(e.request));return;}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
  const blob = new Blob([sw], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

// ================================================================
// UTILS
// ================================================================
function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function mkLabel(mk) {
  const M = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];
  const [y,m] = mk.split('-');
  return M[parseInt(m)-1] + ' ' + y;
}
function pad(n) { return String(n).padStart(2, '0'); }
function initials(n) { return n.split(' ').map(p => p[0]||'').join('').substring(0,2).toUpperCase(); }
function calcH(hours, shift) {
  if (['REPOS','CONGES'].includes(shift)) return 0;
  if (shift === 'JOURNEE') return 7;
  const m = hours.match(/(\d+)h(\d*)\s*[-\/]\s*(\d+)h(\d*)/);
  if (m) {
    const s = parseInt(m[1]) + (parseInt(m[2]||0)/60);
    const e = parseInt(m[3]) + (parseInt(m[4]||0)/60);
    return Math.max(0, e - s);
  }
  return 0;
}
function lsSet(k,v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }
function lsGet(k)   { try { return JSON.parse(localStorage.getItem(k)); } catch(_){ return null; } }
